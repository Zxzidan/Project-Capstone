<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finova - Sign Up</title>
    <style>
      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
        background: var(--color-bg);
      }
      .login-card {
        width: 100%;
        max-width: 1200px;
        padding: 4rem;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2.5rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .section-title {
        grid-column: span 2;
        margin-top: 4rem;
        margin-bottom: 2.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--border-color);
        color: var(--color-primary);
        font-weight: 700;
        font-size: 1.35rem;
      }
      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .section-title {
          grid-column: span 1;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/app-Cc8hLvQh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Db4695YN.css">
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav
      class="flex justify-center items-center"
      style="background: white; border-bottom: 1px solid #f1f5f9; position: fixed; width: 100%; top: 0; z-index: 1000; padding-top: 1rem; padding-bottom: 1rem;"
    >
      <div class="container flex justify-between items-center w-full" style="padding: 0 2rem; max-width: 1250px;">
        <a href="/" class="flex items-center gap-3" style="text-decoration: none;">
          <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #ff8c42 0%, #ff6633 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 1.25rem; box-shadow: 0 4px 12px rgba(255, 102, 51, 0.25); transform: rotate(-2deg);">F</div>
          <span class="logo-text" style="font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; color: #1a1a1a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">Finova</span>
        </a>
        <div class="flex items-center gap-6">
          <select id="langSwitcher" class="btn" style="padding: 0.5rem 1rem; border: 1px solid #e2e8f0; background: white; border-radius: 0.5rem; font-weight: 500; cursor: pointer; color: #475569; outline: none;">
            <option value="en">English</option>
            <option value="id">Indonesia</option>
          </select>
          <a href="/pages/auth/login.html" class="btn btn-secondary" style="text-decoration: none; display: inline-block; padding: 0.6rem 1.5rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.95rem;">Log in</a>
        </div>
      </div>
    </nav>

    <div class="login-container" style="padding-top: 5rem;">
      <div class="glass-panel login-card animate-fade-in">
        <h2 class="text-center mb-2">Create Account</h2>
        <p class="text-center text-secondary mb-8">Join Finova and complete your profile</p>
        
        <form id="signupForm">
          <div class="form-grid">
            <!-- Account Info -->
            <div class="section-title" style="margin-top: 0;">Account Information</div>
            
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" name="email" class="form-control" placeholder="you@example.com" required />
            </div>
            
            <div class="form-group">
              <label class="form-label">Username</label>
              <input type="text" name="username" class="form-control" placeholder="johndoe" required />
            </div>
            
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" placeholder="••••••••" required />
            </div>
            
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" class="form-control" placeholder="John Doe" required />
            </div>

            <!-- Personal Info -->
            <div class="section-title">Personal Information</div>
            
            <div class="form-group">
              <label class="form-label">Umur</label>
              <input type="number" name="age" class="form-control" placeholder="Contoh: 25" required />
            </div>
            
            <div class="form-group">
              <label class="form-label">Gender</label>
              <select name="gender" class="form-control" style="background-color: var(--color-bg);">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Non Binary">Non Binary</option>
              </select>
            </div>
            
            <div class="form-group">
              <label class="form-label">Tingkat Pendidikan</label>
              <select name="education" class="form-control" style="background-color: var(--color-bg);">
                <option value="High School">High School</option>
                <option value="Bachelor">Bachelor</option>
                <option value="Master">Master</option>
                <option value="Phd">Phd</option>
              </select>
            </div>
            
            <div class="form-group">
              <label class="form-label">Status Pernikahan</label>
              <select name="maritalStatus" class="form-control" style="background-color: var(--color-bg);">
                <option value="Single">Single</option>
                <option value="Married">Married</option>
                <option value="Divorced">Divorced</option>
                <option value="Windowed">Windowed</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Jumlah Tanggungan</label>
              <input type="number" name="dependents" class="form-control" placeholder="0" required />
            </div>

            <!-- Employment & Income -->
            <div class="section-title">Pekerjaan & Pendapatan</div>

            <div class="form-group">
              <label class="form-label">Status Karyawan</label>
              <select name="employmentStatus" class="form-control" style="background-color: var(--color-bg);">
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Self-employed">Self-employed</option>
                <option value="Unemployed">Unemployed</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Lama Bekerja (Tahun)</label>
              <input type="number" name="tenure" class="form-control" placeholder="Contoh: 3" required />
            </div>

            <div class="form-group">
              <label class="form-label">Penghasilan tiap bulan</label>
              <div class="amount-wrapper" style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 1rem;">
                <span style="color: var(--color-text-muted);">Rp</span>
                <input type="text" name="monthlyIncome" id="incomeInput" class="form-control" style="border: none;" placeholder="0" required oninput="formatCurrency(this); calculateDTI();" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Nilai Aset yg dimiliki</label>
              <div class="amount-wrapper" style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 1rem;">
                <span style="color: var(--color-text-muted);">Rp</span>
                <input type="text" name="assetValue" class="form-control" style="border: none;" placeholder="0" required oninput="formatCurrency(this)" />
              </div>
            </div>

            <!-- Loans & Debts -->
            <div class="section-title">Pinjaman & Hutang</div>

            <div class="form-group">
              <label class="form-label">Jumlah Pinjaman Aktif</label>
              <div class="amount-wrapper" style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 1rem;">
                <span style="color: var(--color-text-muted);">Rp</span>
                <input type="text" name="loanAmount" class="form-control" style="border: none;" placeholder="0" required oninput="formatCurrency(this)" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Tujuan Pinjaman</label>
              <input type="text" name="loanPurpose" class="form-control" placeholder="Contoh: KPR, Modal Usaha" />
            </div>

            <div class="form-group">
              <label class="form-label">Cicilan Hutang per bulan</label>
              <div class="amount-wrapper" style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 1rem;">
                <span style="color: var(--color-text-muted);">Rp</span>
                <input type="text" name="monthlyDebt" id="debtInput" class="form-control" style="border: none;" placeholder="0" required oninput="formatCurrency(this); calculateDTI();" />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Debt to Income Ratio (DTI)</label>
              <div class="amount-wrapper" style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 1rem; background: rgba(255,255,255,0.05);">
                <input type="text" name="dtiRatio" id="dtiInput" class="form-control" style="border: none; font-weight: bold;" placeholder="0%" readonly />
              </div>
              <small class="text-muted">Otomatis: (Cicilan / Penghasilan) * 100%</small>
            </div>

            <div class="form-group">
              <label class="form-label">Pernah Gagal Bayar?</label>
              <select name="everDefaulted" class="form-control" onchange="toggleDefaultCount(this)">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
              </select>
            </div>

            <div class="form-group" id="defaultCountGroup" style="display: none;">
              <label class="form-label">Berapa kali gagal bayar?</label>
              <input type="number" name="defaultCount" class="form-control" placeholder="0" />
            </div>

            <div class="form-group">
              <label class="form-label">Perubahan Status Perkawinan (Terakhir)</label>
              <input type="text" name="maritalStatusChange" class="form-control" placeholder="Contoh: Menikah 2 tahun lalu" />
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary w-full mt-10" style="width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 600;">
            Sign Up
          </button>
        </form>
        
        <div class="mt-6 text-center">
          <p class="text-secondary text-sm">
            Already have an account? <a href="/pages/auth/login.html" style="color: var(--color-primary); font-weight: 500;">Sign in</a>
          </p>
        </div>
      </div>
    </div>
    
    <script>
      function formatCurrency(input) {
        let value = input.value.replace(/\D/g, '');
        if (value !== "") {
          input.value = new Intl.NumberFormat('id-ID').format(value);
        } else {
          input.value = "";
        }
      }

      function calculateDTI() {
        const income = parseFloat(document.getElementById('incomeInput').value.replace(/\./g, '')) || 0;
        const debt = parseFloat(document.getElementById('debtInput').value.replace(/\./g, '')) || 0;
        const dtiInput = document.getElementById('dtiInput');
        
        if (income > 0) {
          const ratio = (debt / income) * 100;
          dtiInput.value = ratio.toFixed(1) + '%';
        } else {
          dtiInput.value = '0%';
        }
      }

      function toggleDefaultCount(select) {
        const group = document.getElementById('defaultCountGroup');
        group.style.display = select.value === 'Yes' ? 'block' : 'none';
      }
    </script>
  </body>
</html>
