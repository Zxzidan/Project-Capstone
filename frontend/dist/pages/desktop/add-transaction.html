<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finova - Add Transaction</title>
    <!-- AI Scan Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="/js/finova-ai.js"></script>
    <style>
      .transaction-form-card {
        max-width: 600px;
        margin: 0 auto;
      }
      .amount-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        background: var(--color-surface);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: var(--spacing-2) var(--spacing-4);
      }
      .amount-wrapper span {
        font-size: 1.5rem;
        color: var(--color-text-muted);
        margin-right: var(--spacing-2);
      }
      .amount-wrapper input {
        background: transparent;
        border: none;
        color: var(--color-text-primary);
        font-size: 1.5rem;
        width: 100%;
        outline: none;
      }
    </style>
    <script type="module" crossorigin src="/assets/app-Cc8hLvQh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Db4695YN.css">
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 class="text-xl font-bold"><span class="text-gradient">Finova</span></h2>
        </div>
        <nav class="sidebar-nav">
          <a href="/pages/desktop/dashboard.html" class="nav-item">Dashboard</a>
          <a href="/pages/desktop/insights.html" class="nav-item">Insights & Reports</a>
          <a href="/pages/desktop/add-transaction.html" class="nav-item active">Add Transaction</a>
          <a href="/pages/desktop/profile.html" class="nav-item">Profile</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content flex items-center justify-center">
        
        <div class="glass-panel p-8 transaction-form-card w-full animate-fade-in">
          <h2 class="mb-6 border-b pb-4" style="border-bottom: 1px solid var(--border-color);">New Transaction</h2>
          
          <!-- Mode Selection Tabs -->
          <div class="flex gap-4 mb-8">
            <button id="btnAuto" class="btn btn-primary flex-1" onclick="switchMode('auto')">
              📷 Foto Struk
            </button>
            <button id="btnManual" class="btn btn-secondary flex-1" onclick="switchMode('manual')">
              📝 Input Manual
            </button>
          </div>

          <!-- Auto Scan Mode -->
          <div id="autoMode" class="animate-fade-in">
            <div class="text-center mb-8">
              <h3 class="mb-2">Scan Struk Otomatis</h3>
              <p class="text-secondary">Gunakan AI untuk mendeteksi jumlah, kategori, dan tanggal dari struk Anda.</p>
            </div>
            
            <div class="form-group mb-8">
              <label class="scan-wrapper" style="display: block; border: 2px dashed var(--color-primary); padding: 3rem 1.5rem; text-align: center; border-radius: var(--radius-md); cursor: pointer; background: rgba(59, 130, 246, 0.05); transition: all 0.3s;">
                <div style="font-size: 3rem; margin-bottom: 1rem;">🧾</div>
                <div id="scanStatusTitle" style="color: var(--color-primary); font-size: 1.25rem; font-weight: 600;">Klik untuk Upload Foto Struk</div>
                <div id="scanStatusSub" style="color: var(--color-text-secondary); font-size: 0.9rem; margin-top: 0.5rem;">AI akan otomatis mengisi form untuk Anda</div>
                <input type="file" accept="image/*,.pdf" style="display: none;" id="receiptInput" />
              </label>
            </div>
            
            <div class="flex justify-center">
              <a href="/pages/desktop/dashboard.html" class="btn btn-secondary">Batal</a>
            </div>
          </div>

          <!-- Manual Form Mode -->
          <div id="manualMode" class="animate-fade-in" style="display: none;">
            <form id="addTxForm">
              <div class="form-group">
                <label class="form-label">Jumlah Uang</label>
                <div class="amount-wrapper">
                  <span>Rp</span>
                  <input type="text" name="amount" id="amountInput" placeholder="0" required oninput="formatCurrency(this)" />
                </div>
              </div>

              <div class="grid md:grid-cols-2 gap-4">
                <div class="form-group">
                  <label class="form-label">Tipe</label>
                  <select name="type" class="form-control">
                    <option value="Expense">Pengeluaran</option>
                    <option value="Income">Pemasukan</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Tanggal</label>
                  <input type="date" name="date" class="form-control" required />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Kategori</label>
                <select name="category" class="form-control">
                  <option>Makanan & Minuman</option>
                  <option>Transportasi</option>
                  <option>Belanja</option>
                  <option>Hiburan</option>
                  <option>Tagihan</option>
                  <option>Lainnya</option>
                </select>
              </div>

              <div class="form-group mb-8">
                <label class="form-label">Deskripsi</label>
                <textarea name="notes" class="form-control" rows="3" placeholder="Untuk apa transaksi ini?"></textarea>
              </div>

              <div class="flex justify-end gap-4">
                <a href="/pages/desktop/dashboard.html" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary">Simpan Transaksi</button>
              </div>
            </form>
          </div>
        </div>

        <script>
          function formatCurrency(input) {
            // Remove non-digits
            let value = input.value.replace(/\D/g, '');
            
            // Format with dots
            if (value !== "") {
              input.value = new Intl.NumberFormat('id-ID').format(value);
            } else {
              input.value = "";
            }
          }

          function switchMode(mode) {
            const autoMode = document.getElementById('autoMode');
            const manualMode = document.getElementById('manualMode');
            const btnAuto = document.getElementById('btnAuto');
            const btnManual = document.getElementById('btnManual');

            if (mode === 'auto') {
              autoMode.style.display = 'block';
              manualMode.style.display = 'none';
              btnAuto.className = 'btn btn-primary flex-1';
              btnManual.className = 'btn btn-secondary flex-1';
            } else {
              autoMode.style.display = 'none';
              manualMode.style.display = 'block';
              btnAuto.className = 'btn btn-secondary flex-1';
              btnManual.className = 'btn btn-primary flex-1';
            }
          }
        </script>

      </main>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const input = document.getElementById('receiptInput');
        const statusTitle = document.getElementById('scanStatusTitle');
        const statusSub = document.getElementById('scanStatusSub');
        
        // Inisialisasi FinovaAI saat halaman dimuat
        console.log('Desktop Page Load: Initializing FinovaAI...');
        try {
          await FinovaAI.init('/tfjs/model.json');
        } catch (e) {
          console.error('Failed to initialize FinovaAI', e);
        }

        // Cek jika diarahkan dari scanner.html eksternal dengan data pra-scan
        const scanned = sessionStorage.getItem('scannedReceipt');
        if (scanned) {
          try {
            const result = JSON.parse(scanned);
            sessionStorage.removeItem('scannedReceipt');
            
            const amountInput = document.getElementById('amountInput');
            const dateInput = document.querySelector('input[name="date"]');
            const notesInput = document.querySelector('textarea[name="notes"]');
            
            if (amountInput) {
              amountInput.value = new Intl.NumberFormat('id-ID').format(result.total_ocr);
            }
            if (dateInput) {
              dateInput.value = result.tanggal;
            }
            if (notesInput) {
              notesInput.value = `Scan Struk [${result.currency}]`;
            }
            
            switchMode('manual');
          } catch (e) {
            console.error('Error loading pre-scanned receipt:', e);
          }
        }

        if (input) {
          input.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusTitle.textContent = '🤖 Memproses Struk... (0%)';
            statusSub.textContent = 'Menjalankan OCR dan pengenalan teks...';

            const progressHandler = (event) => {
              statusTitle.textContent = `🤖 Memproses Struk... (${event.detail.progress}%)`;
            };
            window.addEventListener('finova-scan-progress', progressHandler);

            try {
              // Jalankan scanning
              const hasil = await FinovaAI.scan(file);
              
              // Isi form otomatis
              const amountInput = document.getElementById('amountInput');
              const dateInput = document.querySelector('input[name="date"]');
              const notesInput = document.querySelector('textarea[name="notes"]');

              if (amountInput) {
                amountInput.value = new Intl.NumberFormat('id-ID').format(hasil.total_ocr);
              }
              if (dateInput) {
                dateInput.value = hasil.tanggal;
              }
              if (notesInput) {
                notesInput.value = `Scan Struk [${hasil.currency}]`;
              }

              statusTitle.textContent = '✅ Struk Berhasil Discan!';
              statusSub.textContent = 'Beralih ke form pengisian...';

              // Tunggu 1 detik biar animasi selesai
              setTimeout(() => {
                switchMode('manual');
                // Reset status scan
                statusTitle.textContent = 'Klik untuk Upload Foto Struk';
                statusSub.textContent = 'AI akan otomatis mengisi form untuk Anda';
                input.value = '';
              }, 1000);

            } catch (err) {
              console.error('Scan error:', err);
              statusTitle.textContent = '❌ Gagal Memindai Struk';
              statusSub.textContent = 'Pastikan gambar struk terlihat jelas dan coba lagi.';
              statusTitle.style.color = '#ef4444';
            } finally {
              window.removeEventListener('finova-scan-progress', progressHandler);
            }
          });
        }
      });
    </script>
  </body>
</html>
