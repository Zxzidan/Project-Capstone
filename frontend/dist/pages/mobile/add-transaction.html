<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Finova - Add Transaction</title>
    <!-- AI Scan Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="/js/finova-ai.js"></script>
    <style>
      .mobile-layout {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--color-bg);
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
      }
      
      .mobile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--spacing-4);
        border-bottom: 1px solid var(--border-color);
      }
      
      .amount-input {
        background: transparent;
        border: none;
        color: var(--color-text-primary);
        font-size: 3rem;
        font-weight: 700;
        text-align: center;
        width: 100%;
        outline: none;
        padding: var(--spacing-6) 0;
      }
      
      .amount-input::placeholder {
        color: var(--color-text-muted);
      }
      
      .category-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--spacing-3);
        margin-bottom: var(--spacing-6);
      }
      
      .category-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      
      .cat-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--glass-bg);
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        transition: all var(--transition-fast);
      }
      
      .category-item.active .cat-icon {
        background: var(--color-primary);
        border-color: var(--color-primary);
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
      }
      
      .cat-label {
        font-size: 0.75rem;
        color: var(--color-text-secondary);
        text-align: center;
      }
      
      .form-section {
        background: var(--glass-bg);
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        padding: var(--spacing-6);
        min-height: 50vh;
      }
    </style>
    <script type="module" crossorigin src="/assets/app-Cc8hLvQh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Db4695YN.css">
  </head>
  <body>
    <div class="mobile-layout animate-fade-in">
      
      <!-- Header -->
      <header class="mobile-header">
        <a href="/pages/mobile/dashboard.html" class="avatar" style="background: transparent; border: 1px solid var(--border-color); width: 36px; height: 36px;">✕</a>
        <h3 style="margin: 0;">Add Expense</h3>
        <div style="width: 36px;"></div> <!-- Spacer -->
      </header>

      <!-- Amount -->
      <form id="addTxForm">
        <div class="text-center text-secondary mt-6">How much?</div>
        <div style="position: relative; display: flex; justify-content: center; align-items: center;">
          <span style="font-size: 2rem; position: absolute; left: 15%; color: var(--color-text-muted);">Rp</span>
          <input type="number" name="amount" class="amount-input" placeholder="0" step="1" required />
        </div>

      <!-- Details Form -->
      <div class="form-section">
        
        <h4 class="mb-4 text-sm text-secondary uppercase tracking-wider">Category</h4>
        <div class="category-grid">
          <div class="category-item active">
            <div class="cat-icon"></div>
            <span class="cat-label">Groceries</span>
          </div>
          <div class="category-item">
            <div class="cat-icon"></div>
            <span class="cat-label">Dining</span>
          </div>
          <div class="category-item">
            <div class="cat-icon"></div>
            <span class="cat-label">Transport</span>
          </div>
          <div class="category-item">
            <div class="cat-icon"></div>
            <span class="cat-label">Shopping</span>
          </div>
        </div>

        <div class="form-group">
          <input type="hidden" name="type" value="Expense" />
          <input type="hidden" name="category" value="Groceries" />
          <label class="form-label">Note</label>
          <input type="text" name="notes" class="form-control" placeholder="What was this for?" />
        </div>
        
        <div class="form-group mb-4">
          <label class="form-label">Date</label>
          <input type="date" name="date" class="form-control" value="2026-05-01" required />
        </div>

        <div class="form-group mb-8">
          <label class="form-label">Scan Struk / Receipt (Auto-fill)</label>
          <label class="scan-wrapper" style="display: block; border: 1px dashed var(--color-primary); padding: 1rem; text-align: center; border-radius: var(--radius-md); cursor: pointer; background: rgba(59, 130, 246, 0.05); transition: all 0.3s;">
            <div style="font-size: 1.5rem; margin-bottom: 0.25rem;">🧾</div>
            <div id="scanStatus" style="color: var(--color-primary); font-size: 0.875rem; font-weight: 500;">Tap to Scan Receipt</div>
            <input type="file" accept="image/*" capture="environment" style="display: none;" id="receiptInput" />
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="width: 100%; padding: 1rem; border:none; border-radius: var(--radius-full);">
          Save Transaction
        </button>
      </div>
      </form>
      
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const input = document.getElementById('receiptInput');
        const status = document.getElementById('scanStatus');
        
        // Inisialisasi FinovaAI saat halaman dimuat
        console.log('Mobile Page Load: Initializing FinovaAI...');
        try {
          await FinovaAI.init('/tfjs/model.json');
        } catch (e) {
          console.error('Failed to initialize FinovaAI', e);
        }

        input.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          status.textContent = '🤖 Scanning... 0%';
          status.style.color = 'var(--color-text-secondary)';

          // Event progress listener untuk progress bar/text
          const progressHandler = (event) => {
            status.textContent = `🤖 Scanning... ${event.detail.progress}%`;
          };
          window.addEventListener('finova-scan-progress', progressHandler);

          try {
            // Jalankan scanning
            const hasil = await FinovaAI.scan(file);
            
            // Isi form otomatis
            const amountInput = document.querySelector('input[name="amount"]');
            const dateInput = document.querySelector('input[name="date"]');
            const notesInput = document.querySelector('input[name="notes"]');

            if (amountInput) {
              amountInput.value = hasil.total_ocr;
            }
            if (dateInput) {
              dateInput.value = hasil.tanggal;
            }
            if (notesInput) {
              notesInput.value = `Scan Struk [${hasil.currency}]`;
            }

            status.textContent = '✅ Scanned Successfully!';
            status.style.color = '#10b981';
          } catch (err) {
            console.error('Scan error:', err);
            status.textContent = '❌ Scan failed. Try again.';
            status.style.color = '#ef4444';
          } finally {
            window.removeEventListener('finova-scan-progress', progressHandler);
          }
        });
      });
    </script>
  </body>
</html>
