<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finova - Login</title>
    <link rel="stylesheet" href="/css/index.css" />
    <style>
      .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--spacing-4);
      }
      .login-card {
        width: 100%;
        max-width: 420px;
        padding: var(--spacing-8);
      }
      .logo-icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: var(--color-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: var(--color-text-primary);
        margin: 0 auto var(--spacing-6);
        box-shadow: var(--shadow-md);
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav
      class="flex justify-center items-center"
      style="background: white; border-bottom: 1px solid #f1f5f9; position: fixed; width: 100%; top: 0; z-index: 1000; padding-top: 1rem; padding-bottom: 1rem;"
    >
      <div class="container flex justify-between items-center w-full" style="padding: 0 2rem; max-width: 1250px;">
        <a href="/" class="flex items-center gap-3" style="text-decoration: none;">
          <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #ff8c42 0%, #ff6633 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 1.25rem; box-shadow: 0 4px 12px rgba(255, 102, 51, 0.25); transform: rotate(-2deg);">F</div>
          <span class="logo-text" style="font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; color: #1a1a1a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">Finova</span>
        </a>
        <div class="flex items-center gap-6">
          <select id="langSwitcher" class="btn" style="padding: 0.5rem 1rem; border: 1px solid #e2e8f0; background: white; border-radius: 0.5rem; font-weight: 500; cursor: pointer; color: #475569; outline: none;">
            <option value="en">English</option>
            <option value="id">Indonesia</option>
          </select>
          <a href="/pages/auth/signup.html" class="btn-orange" style="text-decoration: none; display: inline-block; padding: 0.6rem 1.5rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.95rem;">Sign up</a>
        </div>
      </div>
    </nav>

    <div class="login-container" style="padding-top: 5rem;">
      <div class="glass-panel login-card animate-fade-in">
        <h2 class="text-center mb-2">Welcome Back</h2>
        <p class="text-center text-secondary mb-8">Sign in to your Finova account</p>
        
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">Username or Email Address</label>
            <input type="text" name="email" class="form-control" placeholder="username or you@example.com" required />
          </div>
          
          <div class="form-group">
            <div class="flex justify-between items-center mb-2">
              <label class="form-label" style="margin-bottom: 0;">Password</label>
              <a href="#" class="text-sm" style="color: var(--color-primary);">Forgot password?</a>
            </div>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required />
          </div>
          
          <button type="submit" class="btn btn-primary w-full mt-4" style="width: 100%; padding: 0.75rem;">
            Sign In
          </button>
        </form>
        
        <div class="mt-6 text-center">
          <p class="text-secondary text-sm">
            Don't have an account? <a href="/pages/auth/signup.html" style="color: var(--color-primary); font-weight: 500;">Sign up</a>
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
